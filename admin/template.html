<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Montagu+Slab:opsz,wght@16..144,100..700&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="../src/styles/pages/document/admin.css" />
    <link rel="stylesheet" href="../src/styles/components/nav/navAdmin.css" />
    <link rel="stylesheet" href="../src/styles/components/sidebar.css" />
    <link
      rel="stylesheet"
      href="../src/styles/components/footer/footerNoLogo.css"
    />
    <link rel="stylesheet" href="../src/styles/components/webFramePanel.css" />

    <!-- Web Page Information -->
    <title>Admin | Doctrax</title>
    <link
      rel="icon"
      href="../assets/images/Santa_Elena_Camarines_Norte.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div
      class="container"
      id="container"
      style="transition: grid-template-columns 0.3s linear"
    >
      <aside>
        <div class="sidebar-panel" id="sidebarPanel"></div>
      </aside>
      <!-- Top Navigation Bar -->
      <nav>
        <div class="navbar-container" id="navbar"></div>
      </nav>
      <main>
        <!-- Dashboard Section -->
        <div class="dashboard-container">
          <div class="dashboard-header">
            <div class="overview-upper">
              <div class="dashboard-title">DASHBOARD</div>
              <div class="user-profile">
                <input type="text" class="search-bar" placeholder="Search" />
                <div class="user-info">
                  <img
                    src="../assets/icons/material-design-icons/account_circle_36dp_000000.svg"
                    alt="User"
                  />
                  <span id="dashboardLoggedName">Placeholder</span>
                </div>
              </div>
            </div>
            <div class="overview-lower">
              <div class="dashboard-cards">
                <div class="dashboard-card">
                  <div class="card-title">Municipal Health Office</div>
                  <span class="card-value" id="hoRecordValue"></span>
                </div>
                <div class="dashboard-card">
                  <div class="card-title">Civil Register Office</div>
                  <span class="card-value" id="croRecordValue"></span>
                </div>
                <div class="dashboard-card">
                  <div class="card-title">General Services Office</div>
                  <dspan class="card-value" id="gsoRecordValue"></span>
                </div>
                <div class="dashboard-card">
                  <div class="card-title">Agricultural Office</div>
                  <span class="card-value" id="agoRecordValue"></span>
                </div>
                <div class="dashboard-card">
                  <div class="card-title">Agricultural Office</div>
                  <span class="card-value" id="acoRecordValue"></span>
                </div>
              </div>
            </div>
          </div>
          <!-- Process Documents Table -->
          <div class="documents-section">
            <h3>Process Documents</h3>
            <table class="documents-table" id="showLogs">
              <thead>
                <tr>
                  <th>PEOPLE</th>
                  <th>REQUEST</th>
                  <th>STATUS</th>
                  <th>HANDLED</th>
                  <th>DATE PROCESSED</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
      <!-- Page Footer -->
      <footer><div class="footer-container" id="footer"></div></footer>
    </div>

    <!-- Local Scripts -->
    <script src="../src/scripts/components/navbar.js"></script>
    <script src="../src/scripts/components/footer.js"></script>
    <script src="../src/scripts/components/sidebar.js"></script>
    <script src="../src/modules/accounts/auth.js"></script>
    <script src="../src/scripts/pages/admin/admin.js"></script>
    <script src="../src/modules/notifications/notification.js"></script>
    <script>
      //document.addEventListener("DOMContentLoaded", loadSidebarAdmin);
      document.addEventListener("DOMContentLoaded", loadNavAdmin);
      document.addEventListener("DOMContentLoaded", loadSidebarAdmin);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
    <script>
      checkLogin();
    </script>
  </body>
</html>

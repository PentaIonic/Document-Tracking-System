<!-- Main Search Panel -->
<div class="container">
  <div class="portal-panel">
    <!-- Header Section -->
    <div class="panel-header">
      <h1>Biringan City<br /><span class="doctrax">DOCTRAX</span></h1>
      <p>
        Know the status of your document by<br />
        providing a valid Document ID or QR
        <br />code below.
      </p>
    </div>

    <!-- Search Section -->
    <div class="panel-body">
      <div class="search-input-wrapper">
        <input
          type="text"
          name="document-ID"
          id="documentID"
          placeholder="Document ID"
          required
        />
        <span class="material-icons-round">search</span>
      </div>

      <div class="or-separator">or</div>

      <button class="upload-btn">
        <span class="upload-text">Upload File</span>
        <span class="icon-svg">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M20 15V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18L4 15M8 11L12 15M12 15L16 11M12 15V3"
              stroke="black"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>
    </div>
  </div>
</div>

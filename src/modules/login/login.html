<div class="container">
  <div class="portal-panel">
    <div class="panel-header">
      <h1>Biringan City DOCTRAX</h1>
      <p>The Document tracking system of Biringan Municipalty</p>
    </div>
    <form action="" method="post">
      <div class="panel-body">
        <input type="text" name="account-id" id="accountID" required />
        <label for="accountID">Account ID</label>
        <input
          type="password"
          name="account-password"
          id="accountPassword"
          required
        />
        <label for="accountPassword">Password</label>
        <input type="submit" name="Login" value="SIGN IN" />
        <img class="login-img" src="../../assets/icons/user.svg" alt="" />
      </div>
    </form>
    <div class="panel-footer">
      <p>For Non-Admin users, track your documents here.</p>
      <a href="#">
        <div class="track-document-button">
          <img src="../../assets/icons/document-minus.svg" alt="" />
          <label for="track-document-button">Track Doc</label>
        </div>
      </a>
    </div>
  </div>
</div>

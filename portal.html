<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="./src/styles/pages/portal/portal.css" />
    <link rel="stylesheet" href="./src/styles/components/nav/navIndex.css" />
    <link
      rel="stylesheet"
      href="./src/styles/components/footer/footerNoLogo.css"
    />
    <link rel="stylesheet" href="./src/styles/components/webFrame.css" />

    <!-- Web Page Information -->
    <title>Doctrax</title>
    <link
      rel="icon"
      href="./assets/images/Santa_Elena_Camarines_Norte.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <navbar>
      <div class="navbar-container" id="navbar"></div>
    </navbar>
    <!-- Index Panels -->
    <main id="mainContainer">
      <div class="container">
        <div class="portal-panel">
          <div class="panel-header">
            <h1>Santa Elena DOCTRAX</h1>
            <p>The Document tracking system of Santa Elena Municipalty</p>
          </div>
          <form id="loginForm">
            <div class="panel-body">
              <input
                type="text"
                name="account-id"
                id="accountID"
                placeholder="Account ID"
                required
              />
              <label for="accountID">Account ID</label>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Password"
                required
              />
              <label for="accountID">Password</label>
              <button type="submit">Sign In</button>
              <img class="login-img" src="../../assets/icons/user.svg" alt="" />
              <p id="errorLogin" style="color: red"></p>
            </div>
          </form>
          <div class="panel-footer">
            <p>For Non-Admin users, track your documents here.</p>
            <a href="./search.html">
              <div class="track-document-button">
                <img src="../../assets/icons/document-minus.svg" alt="" />
                <label for="track-document-button">Track Doc</label>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>
    <!-- Page Footer -->
    <footer><div class="footer-container" id="footer"></div></footer>
    <!-- Local Scripts -->
    <script src="./src/scripts/components/navbar.js"></script>
    <script src="./src/scripts/components/footer.js"></script>
    <script src="./src/modules/accounts/users.js"></script>
    <script src="./src/modules/accounts/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", loadNavIndex);
      document.addEventListener("DOMContentLoaded", loadFooterBasePage);
    </script>
    <script>
      redirectHome();
    </script>
  </body>
</html>

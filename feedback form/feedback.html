<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Montagu+Slab:opsz,wght@16..144,100..700&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">
</head>
<body>

  <div class="navbar">
    <img src="../assets/images/vhslogo.png" alt="logo">
    <span class="brand">Santa Elena Doctrax</span></span>
  </div>


  <div class="container">
    <div class="form-box">
      <span class="close-btn" onclick="closeForm()">✕</span>

      <div class="header">
        <img src= "../assets/images/vhslogo.png" alt="logo">
        <h3>Feedback Form</h3>
      </div>

      <form class="feedback-form">
        <label>How satisfied are you with our services?</label>
        <div class="rating">
          <input type="radio" name="rating" id="r5"><label for="r5"></label>
          <input type="radio" name="rating" id="r4"><label for="r4"></label>
          <input type="radio" name="rating" id="r3"><label for="r3"></label>
          <input type="radio" name="rating" id="r2"><label for="r2"></label>
          <input type="radio" name="rating" id="r1" required><label for="r1"></label>
        </div>

        <label for="like">What did you like about our service?</label>
        <textarea id="like" rows="3"></textarea>

        <label for="improve">What can we improve?</label>
        <textarea id="improve" rows="3"></textarea>

        <label>Would you recommend us to others?</label>
        <div class="radio-group">
          <label><input type="radio" name="recommend" value="yes"> Yes</label>
          <label><input type="radio" name="recommend" value="no"> No</label>
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

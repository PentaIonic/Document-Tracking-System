<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="./styles/portal.css" />
    <link rel="stylesheet" href="./components/styles/webFrame.css" />

    <!-- Web Page Information -->
    <title>Portal | Deploy</title>
  </head>
  <body>
    <main>
      <div class="portal-container">
        <div class="login-panel">
          <form action="" class="login-panel-form">
            <div class="login-panel-header">
              <h1>Login</h1>
            </div>
            <div class="login-panel-body">
              <div class="login-panel-body-input">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required />
              </div>
              <div class="login-panel-body-input">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required />
              </div>
            </div>
            <input type="submit" value="Login" class="submit-button" />
          </form>
        </div>
      </div>
    </main>
    <!-- Local Scripts -->
    <script src="./scripts/portal/portal.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="../src/styles/components/navbar.css" />
    <link rel="stylesheet" href="../src/styles/components/footer.css" />

    <!-- Web Page Information -->
    <title>Home</title>
    <link rel="icon" href="#" type="image/x-icon" />

    <!-- Top Navigation Bar -->
    <navbar>
      <div class="navbar-container" id="navbar"></div>

    <!-- Page Content -->

    <script src="../src/scripts/components/footer.js"></script>
    <script src="../src/scripts/components/sidebar.js"></script>

    <script>
      // Loading Components
      document.addEventListener("DOMContentLoaded", loadNavbarPageContent);

      document.addEventListener("DOMContentLoaded", loadSidebarPageContent);
    </script>
  </body>

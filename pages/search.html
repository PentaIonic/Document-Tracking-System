<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Document</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Mate&family=Rambla:wght@400;700&family=Source+Serif+4:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="../src/styles/pages/search.css" />
    <link rel="stylesheet" href="../src/styles/modules/search/search-panel.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="top-header">
      <div class="brand">
        <img src="page-logo.svg" alt="Logo" />
        <span class="brand-text">Biringan Doctrax</span>
      </div>
      <div class="nav-buttons">
        <a href="#" class="nav-link">Log In</a>
        <a href="#" class="nav-link active">Home</a>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="portal-panel">
          <div class="panel-header">
            <h1>Biringan City <br /><span>DOCTRAX</span></h1>
            <p>
              Know the status of your document by providing a valid Document ID or QR code below.
            </p>
          </div>

          <!-- Search Section -->
          <div class="panel-body">
           <div class="search-input-wrapper input-block">
             <input type="text" name="document-id" id="documentID" placeholder="Document ID" required />
             <span class="material-icons-round">search</span>
          </div>

           <!-- OR Separator -->
            <div class="or-separator">or</div>

            <!-- Upload Button -->
              <button class="upload-btn input-block">
              <span>Upload File</span>
              <span class="material-icons-round">upload</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link
      rel="stylesheet"
      href="../src/styles/components/navbarClerkPanel.css"
    />
    <link rel="stylesheet" href="../src/styles/components/footerNoLogo.css" />
    <link rel="stylesheet" href="../src/styles/components/sidebar.css" />
    <link rel="stylesheet" href="../src/styles//components/webFramePanel.css" />
    <link rel="stylesheet" href="../styles/#" />

    <!-- Web Page Information -->
    <title>Web Name</title>
    <link rel="icon" href="#" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <!-- Top Navigation Bar -->
      <navbar>
        <div class="navbar-container" id="navbar"></div>
      </navbar>
      <!-- Page Content -->
      <main>
        <div class="main-container"></div>
      </main>
      <!-- Sidebar Panel -->
      <div class="left-sidebar" id="sidebarBody">
        <div class="sidebar-container" id="sidebarPanel"></div>
      </div>
      <!-- Page Footer -->
      <footer><div class="footer-container" id="footer"></div></footer>
    </div>

    <!-- Local Scripts -->
    <script src="../src/scripts/components/navbar.js"></script>
    <script src="../src/scripts/components/footer.js"></script>
    <script src="../src/scripts/components/sidebar.js"></script>
    <script src="../scripts/home/#"></script>
    <script>
      // Loading Components
      document.addEventListener("DOMContentLoaded", loadNavbarPageContent);
      document.addEventListener("DOMContentLoaded", loadFooter);
      document.addEventListener("DOMContentLoaded", loadSidebarPageContent);
    </script>
  </body>
</html>

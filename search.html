<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="./src/styles/components/nav/navIndex.css" />
    <link
      rel="stylesheet"
      href="./src/styles/components/footer/footerNoLogo.css"
    />
    <link rel="stylesheet" href="./src/styles/components/webFrame.css" />
    <link rel="stylesheet" href="./src/styles/pages/search/search.css" />
    <link
      rel="stylesheet"
      href="./src/styles/pages/search/search-panel.css"
    />

    <!-- Web Page Information -->
    <title>Search | Doctrax</title>
    <link rel="icon" href="#" type="image/x-icon" />
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <navbar>
      <div class="navbar-container" id="navbar"></div>
    </navbar>

    <!-- Page Content -->
    <main id="container">
      <!-- Main Search Panel -->
      <div class="container">
        <div class="portal-panel">
          <!-- Header Section -->
          <div class="panel-header">
            <h1>Biringan City<br /><span class="doctrax">DOCTRAX</span></h1>
            <p>
              Know the status of your document by providing a valid Document
              ID<br />
              or <br />QR code below.
            </p>
          </div>

          <!-- Search Section -->
          <div class="panel-body">
            <div class="search-input-wrapper">
              <input
                type="text"
                name="document-ID"
                id="documentID"
                placeholder="Document ID"
                required
              />
              <span class="material-icons-round">search</span>
            </div>

            <div class="or-separator" style="display: none;">or</div>

            <button class="upload-btn" style="display: none;">
              <span class="upload-text">Upload File</span>
              <span class="icon-svg">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M20 15V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18L4 15M8 11L12 15M12 15L16 11M12 15V3"
                    stroke="black"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Page Footer -->
    <footer><div class="footer-container" id="footer"></div></footer>

    <!-- Local Scripts -->
    <script src="./src/scripts/components/navbar.js"></script>
    <script src="./src/scripts/components/footer.js"></script>
    <script src="./src/scripts/pages/searchDocument.js"></script>
    <script>
      // Loading Components
      document.addEventListener("DOMContentLoaded", loadNavIndex);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
  </body>
</html>

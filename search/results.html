<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Montagu+Slab:opsz,wght@16..144,100..700&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="../src/styles/pages/search/results.css" />
    <link rel="stylesheet" href="../src/styles/components/nav/navSearch.css" />
    <link
      rel="stylesheet"
      href="../src/styles/components/footer/footerNoLogo.css"
    />
    <link rel="stylesheet" href="../src/styles/components/webFrame.css" />

    <!-- Web Page Information -->
    <title>Results | Doctrax</title>
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <navbar>
      <div class="navbar-container" id="navbar"></div>
    </navbar>
    <!-- Popup Menu -->
    <div class="popup-menu"></div>
    <!-- Index Panels -->
    <main id="mainContainer">
      <div class="results-header">
        <span>Results</span>
        <div class="search-bar">
          <input
            type="search"
            name="searchDocument"
            id="searchDocument"
          />
          <button>
            <div class="search-icon">
              <span class="material-icons-round"> search </span>
            </div>
          </button>
        </div>
      </div>
      <div class="document-results">
        <div class="horz-scroll">
          <table id="documentDatabase" class="document-list">
            <thead>
              <tr>
                <th>#</th>
                <th>Document No.</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
    <!-- Page Footer -->
    <footer><div class="footer-container" id="footer"></div></footer>
    <!-- Local Scripts -->
    <script src="../src/scripts/components/navbar.js"></script>
    <script src="../src/scripts/components/footer.js"></script>
    <script src="../src/scripts/pages/search/searchDocument.js"></script>
    <script src="../src/scripts/pages/search/results.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", loadNavSearch);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
  </body>
</html>

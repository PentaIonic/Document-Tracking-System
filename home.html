<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Web Page Information & Responsive Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Montagu+Slab:opsz,wght@16..144,100..700&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="./src/styles/pages/home.css" />
    <link rel="stylesheet" href="./src/styles/components/nav/navHome.css" />
    <link rel="stylesheet" href="./src/styles/components/footerNoLogo.css" />
    <link rel="stylesheet" href="./src/styles/components/webFrame.css" />

    <!-- Web Page Information -->
    <title>Doctrax</title>
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <navbar>
      <div class="navbar-container" id="navbar"></div>
    </navbar>
    <!-- Popup Menu -->
    <div class="popup-menu"></div>
    <!-- Index Panels -->
    <main id="mainContainer">
      <div class="home-header">
        <div class="logo">
          <img src="./assets/icons/page-logo.svg" alt="" />
        </div>
        <div class="page-name">
          <span>Biringan City</span>
          <span>Document Tracking System</span>
        </div>
        <div class="search-bar">
          <input type="search" name="search-document" id="searchDocument" />
          <img src="./assets/icons/search.svg" />
        </div>
      </div>
      <hr style="width: 100%; box-sizing: border-box" />
      <div class="home-options"></div>
    </main>
    <!-- Page Footer -->
    <footer><div class="footer-container" id="footer"></div></footer>
    <!-- Local Scripts -->
    <script src="./src/scripts/components/navbar.js"></script>
    <script src="./src/scripts/components/footer.js"></script>
    <script src="./src/scripts/modules/home/home.js"></script>
    <script src="./src/modules/accounts/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", loadNavHome);
      document.addEventListener("DOMContentLoaded", loadFooter);
      document.addEventListener("DOMContentLoaded", loadHome);
    </script>
    <script>
      checkLogin();
      //temp
      document.getElementById(
        "accountName"
      ).innerText = `Welcome, ${localStorage.getItem("displayName")}!`;
    </script>
  </body>
</html>

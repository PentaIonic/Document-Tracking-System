<html lang="en">
  <head>

    <meta charset="UTF-8" />

    <!-- Font Styles & Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&family=Montagu+Slab:opsz,wght@16..144,100..700&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"

    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"

    />

    <!-- Local Styles -->
    <link rel="stylesheet" href="../src/styles/pages/search/navIndex.css" />
    <link rel="stylesheet" href="../src/styles/components/nav/navSector.css" />
    <link rel="stylesheet" href="../src/styles/components/footer/footerNoLogo.css" />
    <link rel="stylesheet" href="../src/styles/components/webFrame.css" />
    <link rel="stylesheet" href="../src/styles/pages/document/tracking.css"/>

    <!-- Web Page Information -->
    <title>Tracking | Doctrax</title>
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <navbar>
      <div class="navbar-container" id="navbar"></div>
    </navbar>

    <!-- Page Content -->
    <main id="container">
  <section class="document-wrapper">
    <h1 class="document-title">DOCUMENT</h1>

    <!-- Document Details Panel -->
<section class="document-panel">
    <table class="document-table">
      <tr>
        <th>Reference Number</th>
        <td></td>
      </tr>
      <tr>
        <th>Personal Information</th>
        <td>
        <div class="info-stack">
        Name:<br />
        Age:<br />
        Sex:<br />
        Address:
  </div>
</td>
      </tr>
      <tr>
        <th>Date of Appeal/Appointment</th>
        <td></td>
      </tr>
      <tr>
        <th>Date of Validation</th>
        <td></td>
      </tr>
      <tr>
        <th>Department</th>
        <td></td>
      </tr>
      <tr>
        <th>Status</th>
        <td></td>
      </tr>
      <tr>
        <th>Action</th>
        <td class="action-buttons">
          <button><span class="material-icons-round">visibility</span> Remarks</button>
          <button><span class="material-icons-round">cancel</span> Cancel Application</button>
        </td>
      </tr>
      <tr>
        <th>QR CODE</th>
        <td>
          <div class="qr-box">
            <div class="qr-inner"></div>
          </div>
        </td>
      </tr>
    </table>
  </section>
  </main>

  <!-- Page Footer -->
    <footer><div class="footer-container" id="footer"></div></footer>

    <!-- Local Scripts -->
    <script src="./src/scripts/components/navbar.js"></script>

      document.addEventListener("DOMContentLoaded", loadNavIndex);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
